name: Repository structure

on:
  push:
    branches:
      - main
      - chore/stage-05-repository-hygiene-2026-11-20
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-layout:
    name: Verify source archive and project links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: python3 tools/check_repository_layout.py
