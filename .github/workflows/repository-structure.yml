name: Repository structure

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-layout:
    name: Verify source archive and project links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check repository structure
        run: python3 tools/check_repository_layout.py
      - name: Check workflow permissions and action pins
        run: python3 tools/check_workflow_security.py
